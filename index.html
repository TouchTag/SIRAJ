<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRAJ × TouchTag</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #3a2300 0%, #0b0f1c 60%, #05070f 100%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* Glowing particles effect */
body:before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background-image:url('https://i.imgur.com/7RZ6YhR.png');
  opacity:0.15;
  background-size:cover;
}

/* Main Card */
.card{
  text-align:center;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding:50px 30px;
  border-radius:30px;
  width:420px;
  box-shadow: 0 0 80px rgba(255,180,0,0.25);
  position:relative;
  z-index:1;
}

/* Logos */
.logos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:30px;
  margin-bottom:30px;
}

.logos img{
  height:90px;
  object-fit:contain;
  filter: drop-shadow(0 0 15px rgba(255,190,0,0.4));
}

/* Title */
h1{
  font-size:28px;
  margin-bottom:8px;
  font-weight:600;
}

.sub{
  color:#f5c76d;
  font-size:14px;
  margin-bottom:30px;
}

/* Buttons */
.btn{
  display:block;
  padding:16px;
  margin:15px 0;
  border-radius:50px;
  font-size:18px;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}

.btn-gold{
  background: linear-gradient(90deg,#d4a646,#ffdd9b);
  color:black;
  box-shadow:0 0 25px rgba(255,200,0,0.6);
}

.btn-gold:hover{
  transform:scale(1.05);
}

.btn-dark{
  background: linear-gradient(90deg,#8c5a00,#c4881a);
  color:white;
  box-shadow:0 0 20px rgba(255,150,0,0.4);
}

.btn-dark:hover{
  transform:scale(1.05);
}

/* Footer */
.footer{
  margin-top:25px;
  font-size:13px;
  color:#d4a646;
}
</style>
</head>

<body>

<div class="card">

  <div class="logos">
    <img src="logo-siraj.png" alt="Siraj">
    <img src="logo-touchtag.png" alt="TouchTag">
  </div>

  <h1>SIRAJ Ramadan Tent × TouchTag</h1>
  <div class="sub">Official NFC Experience Partner</div>

  <a href="/SIRAJ/siraj/" class="btn btn-gold">
    Explore Siraj Tent
  </a>

  <a href="https://touchtag.github.io/TouchTag/" class="btn btn-dark">
    Explore TouchTag
  </a>

  <div class="footer">
    Sponsored & Powered by TouchTag
  </div>

</div>

</body>
</html>
