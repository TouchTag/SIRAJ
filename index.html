<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>St.GeorgeJo & TouchTag</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --gold:#d4af37;
  --gold2:#ffdf9a;
  --orange:#ff6a00;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  color:white;
  background: linear-gradient(180deg,#0b0f1c,#05070f);
  overflow-x:hidden;   
}

/* CENTER */
.wrap{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 15px;
}

/* MAIN CONTAINER */
.card{
  width:520px;
  max-width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  animation:enter .8s ease forwards;
  opacity:0;
  transform:translateY(18px);
}

@keyframes enter{
  to{opacity:1; transform:translateY(0)}
}

/* Lantern */
.lantern{
  font-size:34px;
  color:var(--gold2);
  margin-bottom:10px;
  text-shadow:0 0 18px rgba(255,223,154,.55);
}

/* Logos */
.logos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  margin: 6px 0 5px;
}

.logos img{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:50%;
  background: rgba(13,17,31,.75);
  padding:10px;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 0 18px rgba(255,200,0,.22);
}

.divider{
  width:2px;
  height:50px;
  background:linear-gradient(to bottom,transparent,var(--gold),transparent);
}

/* Middle Logo */
.siraj-title{
  margin:0;
  padding:0;
  line-height:0;
}

.siraj-title img{
  width:430px;
  max-width:95%;
  display:block;
  margin:0 auto;
  filter: drop-shadow(0 0 20px rgba(255,150,0,.35));
}

/* Sub text */
.sub{
  color:#f5c76d;
  font-size:14px;
  margin:5px 0 8px;
}

/* Buttons */
.btn{
  width:420px;
  max-width:95%;
  display:block;
  padding:15px;
  margin:10px auto;
  border-radius:50px;
  font-size:18px;
  font-weight:800;
  text-decoration:none;
  transition:.25s;
  text-align:center;
}

.btn:hover{ transform:scale(1.04); }

.btn-siraj{
  background:linear-gradient(90deg,#d4a646,#ffdd9b);
  color:white;
  box-shadow:0 0 22px rgba(255,200,0,.45);
  font-size:25px;
}

.btn-touch{
  background:linear-gradient(90deg,#8c5a00,#c4881a);
  color:white;
  box-shadow:0 0 20px rgba(255,150,0,.35);

  width:220px; 
  width:85%;
  margin:12px auto 0;
  padding:12px;
  font-size:15px;
  
}

.footer{
  margin-top:15px;
  font-size:13px;
  color:#d4af37;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="lantern">
      <i class="fa-solid fa-mosque"></i>
    </div>

    <div class="logos">
      <img src="ST.png" alt="St George">
      <div class="divider"></div>
      <img src="logo-touchtag.png" alt="TouchTag">
    </div>

    <div class="siraj-title">
      <img src="logo-siraj-removebg-preview1.png" alt="خيمة سراج">
    </div>

    <div class="sub">🕌 اللمة معنا أحلى 🌙</div>

    <a href="/SIRAJ/siraj/" class="btn btn-siraj">خيمة سراج</a>

    <a href="https://touchtag.github.io/TouchTag/" class="btn btn-touch">TouchTag</a>

    <div class="footer">Sponsored & Powered by TouchTag</div>

  </div>
</div>

</body>
</html>
