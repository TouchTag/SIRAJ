<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>St.GeorgeJo & TouchTag</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --gold:#d4af37;
  --gold2:#ffdf9a;
  --orange:#ff6a00;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  color:white;
  overflow:hidden;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(212,175,55,.25), transparent 60%),
    radial-gradient(700px 400px at 20% 15%, rgba(255,106,0,.15), transparent 60%),
    linear-gradient(180deg,#0b0f1c,#05070f);
}

/* STAR CANVAS */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
  opacity:.85;
}

/* CENTER */
.wrap{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
  padding:20px;
}

/* CARD */
.card{
  width:520px;
  max-width:95%;
  padding:34px 28px;
  border-radius:30px;
  background:rgba(15,15,20,.55);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 80px rgba(212,175,55,.22);
  text-align:center;

  animation:enter .8s ease forwards;
  opacity:0;
  transform:translateY(18px);
}

@keyframes enter{
  to{opacity:1; transform:translateY(0)}
}

/* Lantern */
.lantern{
  font-size:34px;
  color:var(--gold2);
  margin-bottom:14px;
  text-shadow:0 0 18px rgba(255,223,154,.55);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

/* Top Logos (CIRCLES) */
.logos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  margin: 6px 0 10px;
}

.logos img{
  width:92px;
  height:92px;
  object-fit:cover;
  border-radius:50%;
  background: rgba(13,17,31,.75);
  padding:10px;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 0 18px rgba(255,200,0,.22);
  transition:.25s ease;
}

.logos img:hover{
  transform:scale(1.06);
}

.divider{
  width:2px;
  height:58px;
  background:linear-gradient(to bottom,transparent,var(--gold),transparent);
}

/* Middle Siraj Logo (BIGGER + LESS EMPTY SPACE) */
.siraj-title{
  margin: 0px 0 0px;      /* قلل الفراغ فوق/تحت */
  padding:0;
  line-height:0;
}

.siraj-title img{
  width: 600px;            /* كبّر */
  max-width: 100%;
  height:auto;
  display:block;
  margin:0 auto;
  filter:none;             /* بدون glow */
  box-shadow:none;
  background:transparent;
}

/* Sub text */
.sub{
  color:#f5c76d;
  font-size:14px;
  margin: 10px 0 18px;     /* أقل فراغ */
}

/* Buttons */
.btn{
  display:block;
  padding:16px;
  margin:12px 0;
  border-radius:50px;
  font-size:17px;
  font-weight:800;
  text-decoration:none;
  transition:.25s;
}

.btn:hover{ transform:scale(1.04); }

.btn-siraj{
  background:linear-gradient(90deg,#d4a646,#ffdd9b);
  color:white;
  box-shadow:0 0 22px rgba(255,200,0,.45);
  font-size:25px;
}

.btn-touch{
  background:linear-gradient(90deg,#8c5a00,#c4881a);
  color:white;
  box-shadow:0 0 20px rgba(255,150,0,.35);

  width:85%;
  margin:12px auto 0;
  padding:12px;
  font-size:15px;
}

.footer{
  margin-top:18px;
  font-size:13px;
  color:#d4af37;
  opacity:.95;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="wrap">
  <div class="card">

    <div class="lantern">
      <i class="fa-solid fa-mosque"></i>
    </div>

    <div class="logos">
      <img src="ST.png" alt="St George">
      <div class="divider"></div>
      <img src="logo-touchtag.png" alt="TouchTag">
    </div>

    <div class="siraj-title">
      <img src="logo-siraj-removebg-preview.png" alt="خيمة سراج">
    </div>

    <div class="sub">🕌 اللمة معنا أحلى 🌙</div>

    <a href="/SIRAJ/siraj/" class="btn btn-siraj">خيمة سراج</a>

    <a href="https://touchtag.github.io/TouchTag/" class="btn btn-touch">TouchTag</a>

    <div class="footer">Sponsored & Powered by TouchTag</div>

  </div>
</div>

<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let stars = [];
function initStars(){
  stars = [];
  for(let i=0;i<120;i++){
    stars.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*2,
      d: 0.3 + Math.random()*1.2
    });
  }
}
initStars();

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "rgba(255,215,130,.85)";
  ctx.beginPath();
  for(let s of stars){
    ctx.moveTo(s.x,s.y);
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2,true);
  }
  ctx.fill();

  for(let s of stars){
    s.y += s.d;
    if(s.y > canvas.height){
      s.y = -5;
      s.x = Math.random()*canvas.width;
    }
  }

  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
