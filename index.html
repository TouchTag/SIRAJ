<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>St.GeorgeJo & TouchTag</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --gold:#d4af37;
  --gold2:#ffdf9a;
  --orange:#ff6a00;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  color:white;
  overflow:hidden;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(212,175,55,.25), transparent 60%),
    radial-gradient(700px 400px at 20% 15%, rgba(255,106,0,.15), transparent 60%),
    linear-gradient(180deg,#0b0f1c,#05070f);
}

/* STAR CANVAS */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
  opacity:.8;
}

/* CENTER */
.wrap{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
  padding:20px;
}

/* CARD */
.card{
  width:520px;
  max-width:95%;
  padding:40px 30px;
  border-radius:30px;
  background:rgba(15,15,20,.55);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 80px rgba(212,175,55,.25);
  text-align:center;
  animation:enter .8s ease forwards;
  opacity:0;
  transform:translateY(20px);
}

@keyframes enter{
  to{opacity:1; transform:translateY(0)}
}

/* Lantern */
.lantern{
  font-size:34px;
  color:var(--gold2);
  margin-bottom:15px;
  text-shadow:0 0 20px rgba(255,223,154,.6);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

/* Logos */
.logos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
  margin-bottom:20px;
}

.logos img{
 .logos img{
  height:90px;
  object-fit:contain;
  filter:none;
  box-shadow:none;
}
}

.divider{
  width:2px;
  height:70px;
  background:linear-gradient(to bottom,transparent,var(--gold),transparent);
}

h1{
  font-size:24px;
  margin:10px 0 6px;
}

.sub{
  color:#f5c76d;
  font-size:14px;
  margin-bottom:25px;
}

/* Buttons */
.btn{
  display:block;
  padding:16px;
  margin:12px 0;
  border-radius:50px;
  font-size:17px;
  font-weight:700;
  text-decoration:none;
  transition:.3s;
}

.btn-siraj{
  background:linear-gradient(90deg,#d4a646,#ffdd9b);
  color:white;
  box-shadow:0 0 25px rgba(255,200,0,.5);

  font-size: 25px;
}

.btn-touch{
  background:linear-gradient(90deg,#8c5a00,#c4881a);
  color:white;
  box-shadow:0 0 25px rgba(255,150,0,.4);
  
  width: 85%;         
  margin: 12px auto;   
  padding: 12px;       
  font-size: 15px;
}

.btn:hover{
  transform:scale(1.05);
}

.footer{
  margin-top:20px;
  font-size:13px;
  color:#d4af37;
}
  .siraj-title{
  text-align:center;
  margin: 15px 0 10px;
}

.siraj-title img{
  width: 350px;  
  max-width: 50%;
  filter: drop-shadow(0 0 25px rgba(212,175,55,.5));
  animation: glowLogo 3s ease-in-out infinite;
}

@keyframes glowLogo{
  0%,100%{ filter: drop-shadow(0 0 20px rgba(212,175,55,.4)); }
  50%{ filter: drop-shadow(0 0 40px rgba(255,215,130,.8)); }
}
  .logos img{
  height:120px;
  object-fit:contain;
  background:transparent;
  box-shadow:none;
  border:none;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="wrap">
  <div class="card">

    <div class="lantern">
      <i class="fa-solid fa-mosque"></i>
    </div>

    <div class="logos">
      <img src="ST-removebg-preview.png" alt="Siraj">
      <div class="divider"></div>
      <img src="logo-touchtag-removebg-preview.png" alt="TouchTag">
    </div>

    <div class="siraj-title">
  <img src="logo-siraj-removebg-preview.png" alt="خيمة سراج">
</div>
    <div class="sub"> 🕌 اللمة معنا أحلى 🌙 </div>

    <a href="/SIRAJ/siraj/" class="btn btn-siraj">
      خيمة سراج
    </a>

    <a href="https://touchtag.github.io/TouchTag/" class="btn btn-touch">
      TouchTag
    </a>

    <div class="footer">
      Sponsored & Powered by TouchTag
    </div>

  </div>
</div>

<script>
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    d:Math.random()*1
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(255,215,130,.8)";
  ctx.beginPath();
  for(let i=0;i<stars.length;i++){
    let s=stars[i];
    ctx.moveTo(s.x,s.y);
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2,true);
  }
  ctx.fill();
  update();
}

function update(){
  for(let i=0;i<stars.length;i++){
    let s=stars[i];
    s.y+=s.d;
    if(s.y>canvas.height){
      s.y=0;
      s.x=Math.random()*canvas.width;
    }
  }
}

setInterval(draw,33);
</script>

</body>
</html>
